# WandB Sweep configuration for hyperparameter search
# Usage: wandb sweep configs/sweep.yaml
# Then:  wandb agent <sweep_id>

program: src/datafog_pii_ner/training/train.py
method: bayes
metric:
  name: eval/overall_f1
  goal: maximize

parameters:
  lr_backbone:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-5
  lr_head:
    distribution: log_uniform_values
    min: 5e-4
    max: 5e-3
  dropout:
    values: [0.05, 0.1, 0.15, 0.2]
  warmup_ratio:
    values: [0.05, 0.1, 0.15]
  weight_decay:
    values: [0.0, 0.01, 0.05]
  batch_size:
    values: [16, 32]
  max_seq_len:
    values: [256, 384]

# Fixed parameters
  epochs:
    value: 10
  backbone:
    value: microsoft/deberta-v3-xsmall
  fp16:
    value: true
